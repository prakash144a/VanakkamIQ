{% extends "platform/base.html" %}
{% block title %}Sign in · VanakkamIQ Platform{% endblock %}
{% block body %}
<main class="login-wrap">
  <div class="card login-card">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"><path d="M5 10v4M9 7v10M13 4v16M17 8v8M21 11v2"/></svg>
      </span>
      <span>
        <span class="brand-name">VanakkamIQ</span>
        <span class="brand-sub">Platform admin</span>
      </span>
    </div>
    <h1>Sign in</h1>
    {% if error %}<div class="alert alert-error" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/platform/login" class="stack">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required value="{{ email }}">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary" type="submit">Sign in</button>
    </form>
  </div>
</main>
{% endblock %}
