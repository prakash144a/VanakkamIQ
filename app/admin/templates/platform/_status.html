{% macro status_chip(status) -%}
{% if status == 'completed' %}<span class="chip chip-success">Completed</span>
{% elif status == 'active' %}<span class="chip chip-success"><span class="dot"></span>Live</span>
{% elif status == 'escalated' %}<span class="chip chip-accent">Handed to staff</span>
{% elif status == 'abandoned' %}<span class="chip">Order not finished</span>
{% elif status == 'failed' %}<span class="chip">Failed</span>
{% else %}<span class="chip">{{ status }}</span>{% endif %}
{%- endmacro %}
