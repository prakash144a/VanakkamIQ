{% extends "layout.html" %}
{% block title %}VanakkamIQ Platform{% endblock %}
{% block body %}
{% from "shared/_ui.html" import brand %}
<header class="topbar">
  {{ brand('/platform', 'Platform admin') }}
  <nav class="topnav" aria-label="Platform">
    <a href="/platform" {% if section == 'businesses' or section is not defined %}aria-current="page"{% endif %}>Businesses</a>
    <a href="/platform/demo-requests" {% if section == 'demo' %}aria-current="page"{% endif %}>Demo requests</a>
    <a href="/platform/usage" {% if section == 'usage' %}aria-current="page"{% endif %}>Usage</a>
    <a href="/platform/admins" {% if section == 'admins' %}aria-current="page"{% endif %}>Admins</a>
  </nav>
  <div class="topbar-right">
    <span class="muted small">{{ admin.email }}</span>
    <form method="post" action="/platform/logout">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <button class="btn-link btn" type="submit">Sign out</button>
    </form>
  </div>
</header>
<main class="page">
  {% block content %}{% endblock %}
</main>
{% endblock %}
