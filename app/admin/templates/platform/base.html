<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}VanakkamIQ Platform{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/static/theme.css">
</head>
<body>
{% block body %}
<header class="topbar">
  <a class="brand" href="/platform">
    <span class="brand-mark" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"><path d="M5 10v4M9 7v10M13 4v16M17 8v8M21 11v2"/></svg>
    </span>
    <span>
      <span class="brand-name">VanakkamIQ</span>
      <span class="brand-sub">Platform admin</span>
    </span>
  </a>
  <div class="topbar-right">
    <span class="muted small">{{ admin.email }}</span>
    <form method="post" action="/platform/logout">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <button class="btn-link btn" type="submit">Sign out</button>
    </form>
  </div>
</header>
<main class="page">
  {% block content %}{% endblock %}
</main>
{% endblock %}
</body>
</html>
